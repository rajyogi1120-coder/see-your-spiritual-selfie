<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>See Your Selfie</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#05070c;color:white}
main{max-width:720px;margin:auto;padding:16px}.stage{position:relative;overflow:hidden;border-radius:22px;background:#111;aspect-ratio:3/4}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
canvas{pointer-events:none}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 18px;background:white;color:#111}
#status{opacity:.8;margin:8px 2px}.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;font-size:14px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px}
h1{font-size:28px;margin:4px 0 2px}.sub{opacity:.72;margin:0 0 14px}
</style>
</head>
<body><main>
<h1>See Your Selfie</h1>
<p class="sub">See the point of light and the seven original virtues of the soul.</p>
<div class="stage"><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas></div>
<div class="controls"><button id="start">Start Camera</button><button id="flip">Flip Camera</button></div>
<div id="status">Tap Start Camera and allow camera access.</div>
<div class="legend">
<div><span class="dot" style="background:#4b2aad"></span>Knowledge</div>
<div><span class="dot" style="background:#ff9f1c"></span>Purity</div>
<div><span class="dot" style="background:#1687ff"></span>Peace</div>
<div><span class="dot" style="background:#ffd928"></span>Happiness</div>
<div><span class="dot" style="background:#20c86b"></span>Love</div>
<div><span class="dot" style="background:#ef3340"></span>Power</div>
<div><span class="dot" style="background:#c9a0ff"></span>Bliss</div>
</div>
</main>
<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

const video=document.querySelector("#video"), canvas=document.querySelector("#overlay"),
ctx=canvas.getContext("2d"), statusEl=document.querySelector("#status");
let stream=null, landmarker=null, facing="user", lastVideoTime=-1;
const virtues=[
 ["Knowledge","#4b2aad"],["Purity","#ff9f1c"],["Peace","#1687ff"],
 ["Happiness","#ffd928"],["Love","#20c86b"],["Power","#ef3340"],["Bliss","#c9a0ff"]
];

async function loadModel(){
 if(landmarker) return;
 statusEl.textContent="Loading face detection…";
 const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm");
 landmarker=await FaceLandmarker.createFromOptions(vision,{
   baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:"GPU"},
   runningMode:"VIDEO",numFaces:1,minFaceDetectionConfidence:.55,minTrackingConfidence:.55
 });
}

async function startCamera(){
 try{
  await loadModel();
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:1280}},audio:false});
  video.srcObject=stream; await video.play();
  statusEl.textContent="Face detected automatically — keep your face in view.";
  requestAnimationFrame(loop);
 }catch(e){statusEl.textContent="Camera could not start. Please allow camera permission and open this site over HTTPS."; console.error(e)}
}
function fit(){
 const r=canvas.getBoundingClientRect(), dpr=devicePixelRatio||1;
 if(canvas.width!==Math.round(r.width*dpr)||canvas.height!==Math.round(r.height*dpr)){canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr)}
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
function drawAura(x,y,scale){
 const W=canvas.getBoundingClientRect().width,H=canvas.getBoundingClientRect().height;
 ctx.save();
 // mirrored canvas coordinate: landmarks are unmirrored, canvas itself is CSS mirrored
 const radius=Math.max(72,Math.min(145,scale*1.7));
 virtues.forEach((v,i)=>{
   const a=-Math.PI/2+(i-3)*0.30, len=radius;
   const ex=x+Math.cos(a)*len, ey=y+Math.sin(a)*len;
   const g=ctx.createLinearGradient(x,y,ex,ey); g.addColorStop(0,v[1]+"ee");g.addColorStop(1,v[1]+"00");
   ctx.strokeStyle=g;ctx.lineWidth=Math.max(5,scale*.07);ctx.lineCap="round";
   ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ex,ey);ctx.stroke();
 });
 ctx.shadowColor="#fff6b0";ctx.shadowBlur=22;ctx.fillStyle="#fffbe8";
 ctx.beginPath();ctx.arc(x,y,Math.max(5,scale*.075),0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=8;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,y,Math.max(2.5,scale*.035),0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function loop(){
 if(!stream) return;
 fit(); const rect=canvas.getBoundingClientRect(); ctx.clearRect(0,0,rect.width,rect.height);
 if(landmarker && video.readyState>=2 && video.currentTime!==lastVideoTime){
  lastVideoTime=video.currentTime;
  const res=landmarker.detectForVideo(video,performance.now());
  if(res.faceLandmarks?.length){
    const p=res.faceLandmarks[0];
    // Use forehead landmarks: center just above glabella, stable between brows/hairline.
    const forehead=p[10], glabella=p[9], left=p[127], right=p[356];
    const fx=forehead.x*.72+glabella.x*.28, fy=forehead.y*.72+glabella.y*.28;
    const faceWidth=Math.hypot((right.x-left.x)*rect.width,(right.y-left.y)*rect.height);
    drawAura(fx*rect.width,fy*rect.height,faceWidth);
    statusEl.textContent="Point of light locked to the centre of the forehead.";
  } else statusEl.textContent="Bring one face clearly into the camera.";
 }
 requestAnimationFrame(loop);
}
document.querySelector("#start").addEventListener("click",startCamera);
document.querySelector("#flip").addEventListener("click",async()=>{facing=facing==="user"?"environment":"user";await startCamera()});
</script></body></html>
