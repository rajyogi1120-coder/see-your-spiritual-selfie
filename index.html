<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>See Your Spiritual Selfie</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#05070c;color:#fff;font-family:system-ui,-apple-system,sans-serif}
main{max-width:720px;margin:auto;padding:16px}.stage{position:relative;overflow:hidden;border-radius:22px;background:#111;aspect-ratio:3/4}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}video{transform:scaleX(-1)}canvas{pointer-events:none}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:13px 19px;background:#fff;color:#111;min-height:48px}
#status{margin:8px 2px 14px;opacity:.85}.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:15px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px}
h1{font-size:28px;margin:4px 0}.sub{opacity:.72;margin:0 0 14px}
</style></head>
<body><main>
<h1>See Your Spiritual Selfie</h1>
<p class="sub">See the point of light and the seven original virtues of the soul.</p>
<div class="stage"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas></div>
<div class="controls"><button id="start">Start Camera</button><button id="flip">Flip Camera</button></div>
<div id="status">Tap Start Camera and allow camera access.</div>
<div class="legend">
<div><span class="dot" style="background:#4b2aad"></span>Knowledge</div><div><span class="dot" style="background:#ff9f1c"></span>Purity</div>
<div><span class="dot" style="background:#1687ff"></span>Peace</div><div><span class="dot" style="background:#ffd928"></span>Happiness</div>
<div><span class="dot" style="background:#20c86b"></span>Love</div><div><span class="dot" style="background:#ef3340"></span>Power</div>
<div><span class="dot" style="background:#c9a0ff"></span>Bliss</div></div>
</main>
<script type="module">
const video=document.getElementById("video"),canvas=document.getElementById("overlay"),ctx=canvas.getContext("2d"),statusEl=document.getElementById("status");
let stream=null,facing="user",landmarker=null,running=false,lastTime=-1;
const virtues=[["Knowledge","#4b2aad"],["Purity","#ff9f1c"],["Peace","#1687ff"],["Happiness","#ffd928"],["Love","#20c86b"],["Power","#ef3340"],["Bliss","#c9a0ff"]];

async function cameraFirst(){
 try{
  statusEl.textContent="Requesting camera permission…";
  if(!navigator.mediaDevices?.getUserMedia) throw new Error("Camera API is unavailable in this browser.");
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});
  video.srcObject=stream;
  await video.play();
  statusEl.textContent="Camera started. Loading automatic face detection…";
  running=true; requestAnimationFrame(loop);
  loadDetector();
 }catch(e){console.error(e);statusEl.textContent="Camera error: "+(e.message||e.name)+". In Safari, allow Camera for this website and try again."}
}
async function loadDetector(){
 if(landmarker) return;
 try{
  const mod=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm");
  const vision=await mod.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm");
  landmarker=await mod.FaceLandmarker.createFromOptions(vision,{
   baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"},
   runningMode:"VIDEO",numFaces:1,minFaceDetectionConfidence:.5,minTrackingConfidence:.5
  });
  statusEl.textContent="Face detection ready — look at the camera.";
 }catch(e){console.error(e);statusEl.textContent="Camera is working, but face detection could not load. Reload the page and try again."}
}
function resize(){
 const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1,w=Math.round(r.width*d),h=Math.round(r.height*d);
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
 ctx.setTransform(d,0,0,d,0,0);return r;
}
function draw(x,y,s){
 const r=Math.max(75,Math.min(145,s*1.8));
 ctx.save();
 virtues.forEach((v,i)=>{
  const a=-Math.PI/2+(i-3)*.28,ex=x+Math.cos(a)*r,ey=y+Math.sin(a)*r;
  const g=ctx.createLinearGradient(x,y,ex,ey);g.addColorStop(0,v[1]);g.addColorStop(1,v[1]+"00");
  ctx.strokeStyle=g;ctx.lineWidth=Math.max(5,s*.07);ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ex,ey);ctx.stroke();
 });
 ctx.shadowColor="#fff2a8";ctx.shadowBlur=22;ctx.fillStyle="#fff8d5";ctx.beginPath();ctx.arc(x,y,Math.max(6,s*.075),0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#fff";ctx.shadowBlur=8;ctx.beginPath();ctx.arc(x,y,Math.max(2.5,s*.035),0,Math.PI*2);ctx.fill();ctx.restore();
}
function loop(){
 if(!running)return;
 const r=resize();ctx.clearRect(0,0,r.width,r.height);
 if(landmarker&&video.readyState>=2&&video.currentTime!==lastTime){
  lastTime=video.currentTime;
  try{
   const res=landmarker.detectForVideo(video,performance.now());
   if(res.faceLandmarks?.length){
    const p=res.faceLandmarks[0],f=p[10],g=p[9],l=p[127],rr=p[356];
    // Mirror landmark X to match the mirrored selfie video.
    const x=(1-(f.x*.72+g.x*.28))*r.width,y=(f.y*.72+g.y*.28)*r.height;
    const fw=Math.hypot((rr.x-l.x)*r.width,(rr.y-l.y)*r.height);
    draw(x,y,fw);statusEl.textContent="Point of light locked to the centre of the forehead.";
   }else statusEl.textContent="Bring your face clearly into view.";
  }catch(e){console.error(e)}
 }
 requestAnimationFrame(loop);
}
document.getElementById("start").addEventListener("click",cameraFirst);
document.getElementById("flip").addEventListener("click",async()=>{facing=facing==="user"?"environment":"user";await cameraFirst()});
</script></body></html>
