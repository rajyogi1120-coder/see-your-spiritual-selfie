<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>See Your Selfie</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fffaf2;color:#2b2047;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:22px 16px 34px;text-align:center}
.soul{width:74px;height:74px;margin:4px auto 14px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 30px #ffd45d}
.soul:before{content:"";width:24px;height:24px;border-radius:50%;border:8px solid #ffd76a;box-shadow:0 0 20px #ffcf4a}
h1{font-size:40px;margin:0 0 6px}.sub{font-size:20px;color:#756985;margin:0 0 22px}
.stage{position:relative;width:100%;aspect-ratio:3/4;border-radius:30px;overflow:hidden;background:#151515}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
video{transform:scaleX(-1)}
canvas{pointer-events:none}
.badge{position:absolute;z-index:3;top:18px;font-weight:800;font-size:18px;color:white;text-shadow:0 1px 3px #000}
.left{left:18px}.right{right:18px}
button{width:100%;margin-top:18px;border:0;border-radius:22px;padding:18px;background:#33234d;color:white;font-size:22px;font-weight:800}
#status{margin:14px 4px 0;color:#6f6579;font-size:15px;min-height:22px}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;text-align:left;margin-top:16px}
.legend div{background:white;border-radius:14px;padding:10px;font-weight:700}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:8px}
</style>
</head>
<body>
<main>
  <div class="soul"></div>
  <h1>See Your Selfie</h1>
  <p class="sub">See the original virtues shining from the soul.</p>
  <div class="stage" id="stage">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
    <div class="badge left">Inner Light</div><div class="badge right" id="cameraState">Camera Off</div>
  </div>
  <button id="toggle">Turn On Camera</button>
  <div id="status">Tap Turn On Camera and allow camera access.</div>
  <div class="legend">
    <div><span class="dot" style="background:#5636c9"></span>Knowledge</div>
    <div><span class="dot" style="background:#ff9f1c"></span>Purity</div>
    <div><span class="dot" style="background:#2589e8"></span>Peace</div>
    <div><span class="dot" style="background:#ffd22e"></span>Happiness</div>
    <div><span class="dot" style="background:#20b86a"></span>Love</div>
    <div><span class="dot" style="background:#e9343f"></span>Power</div>
    <div><span class="dot" style="background:#b78ae9"></span>Bliss</div>
  </div>
</main>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/+esm";

const video=document.getElementById("video"), canvas=document.getElementById("overlay"),
ctx=canvas.getContext("2d"), toggle=document.getElementById("toggle"),
statusEl=document.getElementById("status"), cameraState=document.getElementById("cameraState");
let stream=null, landmarker=null, running=false, lastVideoTime=-1;
let smoothX=null,smoothY=null;

const virtues=[
 ["PURITY","#ff9f1c",-90],["PEACE","#2589e8",-63],["HAPPINESS","#ffd22e",-30],
 ["LOVE","#20b86a",0],["POWER","#e9343f",168],["BLISS","#b78ae9",198],["KNOWLEDGE","#5636c9",225]
];

async function loadDetector(){
 if(landmarker) return;
 statusEl.textContent="Loading face detection…";
 const vision=await FilesetResolver.forVisionTasks(
   "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm"
 );
 landmarker=await FaceLandmarker.createFromOptions(vision,{
   baseOptions:{
     modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
     delegate:"CPU"
   },
   runningMode:"VIDEO",numFaces:1,
   minFaceDetectionConfidence:.5,minFacePresenceConfidence:.5,minTrackingConfidence:.5
 });
 statusEl.textContent="Face detection ready.";
}

function fitCanvas(){
 const r=canvas.getBoundingClientRect(), d=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(r.width*d); canvas.height=Math.round(r.height*d);
 ctx.setTransform(d,0,0,d,0,0);
 return {w:r.width,h:r.height};
}
function videoPoint(lm,w,h){
 // object-fit:cover + mirrored video
 const vw=video.videoWidth, vh=video.videoHeight;
 const scale=Math.max(w/vw,h/vh), dw=vw*scale, dh=vh*scale;
 const ox=(w-dw)/2, oy=(h-dh)/2;
 return {x:w-(lm.x*dw+ox), y:lm.y*dh+oy};
}
function drawRays(x,y,w,h){
 ctx.save();
 const len=Math.min(w,h)*.34, start=12;
 virtues.forEach(([name,color,deg])=>{
   const a=deg*Math.PI/180, ex=x+Math.cos(a)*len, ey=y+Math.sin(a)*len;
   const g=ctx.createLinearGradient(x,y,ex,ey); g.addColorStop(0,color+"e8"); g.addColorStop(1,color+"a8");
   ctx.strokeStyle=g;ctx.lineWidth=10;ctx.lineCap="round";
   ctx.beginPath();ctx.moveTo(x+Math.cos(a)*start,y+Math.sin(a)*start);ctx.lineTo(ex,ey);ctx.stroke();
   ctx.font="800 14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif";
   ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineWidth=4;ctx.strokeStyle="white";
   const tx=x+Math.cos(a)*(len+18),ty=y+Math.sin(a)*(len+18);
   ctx.strokeText(name,tx,ty);ctx.fillStyle=color;ctx.fillText(name,tx,ty);
 });
 // bright point of light, not a star shape
 const glow=ctx.createRadialGradient(x,y,1,x,y,30);
 glow.addColorStop(0,"#fff");glow.addColorStop(.18,"#fff");glow.addColorStop(.38,"#ffd54a");glow.addColorStop(1,"rgba(255,196,0,0)");
 ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,y,30,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
async function loop(){
 if(!running)return;
 const {w,h}=fitCanvas();ctx.clearRect(0,0,w,h);
 if(landmarker && video.readyState>=2 && video.currentTime!==lastVideoTime){
   lastVideoTime=video.currentTime;
   try{
     const res=landmarker.detectForVideo(video,performance.now());
     if(res.faceLandmarks?.length){
       const lm=res.faceLandmarks[0];
       // landmark 168 is the glabella; place soul slightly above it, at center forehead
       const glabella=videoPoint(lm[168],w,h);
       const browL=videoPoint(lm[70],w,h), browR=videoPoint(lm[300],w,h);
       const browWidth=Math.hypot(browL.x-browR.x,browL.y-browR.y);
       const targetX=glabella.x, targetY=glabella.y-browWidth*.23;
       smoothX=smoothX==null?targetX:smoothX*.72+targetX*.28;
       smoothY=smoothY==null?targetY:smoothY*.72+targetY*.28;
       drawRays(smoothX,smoothY,w,h);
       statusEl.textContent="Face detected — inner light is tracking your forehead.";
     } else statusEl.textContent="Move your face fully into the camera view.";
   }catch(e){ statusEl.textContent="Face tracking is starting…"; }
 }
 requestAnimationFrame(loop);
}
async function start(){
 try{
   toggle.disabled=true;
   await loadDetector();
   stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
   video.srcObject=stream; await video.play();
   running=true; cameraState.textContent="Camera On"; toggle.textContent="Turn Off Camera";
   statusEl.textContent="Camera on — looking for your face…";
   requestAnimationFrame(loop);
 }catch(e){
   console.error(e); statusEl.textContent="Could not start camera/face detection. Reload the page and allow camera access.";
 }finally{toggle.disabled=false}
}
function stop(){
 running=false; stream?.getTracks().forEach(t=>t.stop()); stream=null; video.srcObject=null;
 ctx.clearRect(0,0,canvas.width,canvas.height); cameraState.textContent="Camera Off";
 toggle.textContent="Turn On Camera"; statusEl.textContent="Camera is off."; smoothX=smoothY=null;
}
toggle.addEventListener("click",()=>running?stop():start());
</script>
</body>
</html>
