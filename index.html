<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>See Your Spiritual Selfie</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;color:#65400a;background:radial-gradient(circle at 50% 18%,#fff8d9,#f6d879 42%,#c99730 100%);min-height:100vh}main{max-width:740px;margin:auto;padding:20px 14px 35px;text-align:center}h1{font-size:clamp(29px,7vw,49px);font-weight:normal;margin:7px 0;color:#865619;text-shadow:0 1px #fff7d9}.sub{margin:0 0 17px;font:16px system-ui;color:#805f2a}.stage{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:24px;background:radial-gradient(circle,#fff6d5,#d9b34d);box-shadow:0 12px 40px #7c500c55;border:2px solid #fff2bf}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}video{transform:scaleX(-1)}canvas{pointer-events:none}.badge{position:absolute;top:15px;left:15px;color:white;font:600 14px system-ui;text-shadow:0 2px 6px #0009}.status{margin:12px 0;min-height:25px;font:14px system-ui;color:#62420e}button{border:1px solid #f8e6ad;background:linear-gradient(#fff6d5,#dca83d);color:#67430d;padding:14px 24px;border-radius:22px;font:600 16px system-ui;box-shadow:0 3px 12px #94601855}button:disabled{opacity:.5}.hint{font:12px system-ui;color:#77591e;margin:12px}.key{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;font:12px system-ui}.key span{white-space:nowrap;background:#fff9e8b8;border-radius:18px;padding:6px 9px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
</style></head><body><main><h1>See Your Spiritual Selfie</h1><p class="sub">See the original virtues shining from the soul.</p><div class="stage" id="stage"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas><div class="badge" id="badge">Inner Light · Camera Off</div></div><p class="status" id="status">Tap the button to begin.</p><button id="start">Turn On Camera</button><p class="hint">Allow camera access. Keep your face visible for automatic forehead tracking.</p><div class="key" id="key"></div></main>
<script type="module">
const virtues=[['Knowledge','#7655eb',-90],['Purity','#ff9c20',-38.57],['Peace','#1886ff',12.86],['Happiness','#ffd324',64.29],['Love','#1ed452',115.71],['Power','#f33943',167.14],['Bliss','#d66bf5',218.57]];
const video=document.querySelector('#video'),canvas=document.querySelector('#overlay'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage'),status=document.querySelector('#status'),badge=document.querySelector('#badge'),start=document.querySelector('#start');
document.querySelector('#key').innerHTML=virtues.map(([name,color])=>`<span><i class="dot" style="background:${color}"></i>${name}</span>`).join('');
let landmarker=null,stream=null,active=false,center=null,lastVideoTime=-1,lastSeen=0;
function size(){const r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);return {w:r.width,h:r.height}}
function draw(t){if(!active)return;const {w,h}=size();ctx.clearRect(0,0,w,h);if(landmarker&&video.readyState>=2&&video.currentTime!==lastVideoTime){lastVideoTime=video.currentTime;try{const result=landmarker.detectForVideo(video,t);const p=result.faceLandmarks?.[0];if(p){/* forehead: centered above midpoint of brows, below hairline */const l=p[105],r=p[334],upper=p[10],bridge=p[168];if(l&&r&&upper&&bridge){const mx=(l.x+r.x)/2;const browY=(l.y+r.y)/2;const fy=browY*.61+upper.y*.39;center={x:(1-mx)*w,y:fy*h};lastSeen=t}}}catch(e){console.warn(e)}}
if(center&&t-lastSeen<1000){const {x,y}=center;const radius=Math.max(w,h)*.69;const spin=t*.000085;ctx.save();ctx.globalCompositeOperation='screen';const halo=ctx.createRadialGradient(x,y,1,x,y,Math.min(w,h)*.42);halo.addColorStop(0,'#ffffffee');halo.addColorStop(.07,'#fff4bf77');halo.addColorStop(1,'#fff5d000');ctx.fillStyle=halo;ctx.beginPath();ctx.arc(x,y,Math.min(w,h)*.42,0,Math.PI*2);ctx.fill();ctx.restore();
virtues.forEach(([name,color,angle],i)=>{const a=angle*Math.PI/180+spin,ex=x+radius*Math.cos(a),ey=y+radius*Math.sin(a);ctx.save();ctx.globalCompositeOperation='screen';const grad=ctx.createLinearGradient(x,y,ex,ey);grad.addColorStop(0,'#ffffff');grad.addColorStop(.16,color+'c0');grad.addColorStop(.72,color+'85');grad.addColorStop(1,color+'00');ctx.strokeStyle=grad;ctx.lineWidth=2;ctx.shadowColor=color;ctx.shadowBlur=9;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ex,ey);ctx.stroke();ctx.restore();const labelRadius=Math.min(radius*.76,Math.min(w,h)*.47);const tx=x+labelRadius*Math.cos(a),ty=y+labelRadius*Math.sin(a);ctx.font=`600 ${Math.max(11,Math.min(15,w*.032))}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';const tw=ctx.measureText(name).width;const lx=Math.max(tw/2+5,Math.min(w-tw/2-5,tx));const ly=Math.max(13,Math.min(h-13,ty));ctx.lineWidth=3;ctx.strokeStyle='#4a2b0dc0';ctx.strokeText(name,lx,ly);ctx.fillStyle='#fff';ctx.fillText(name,lx,ly)});
ctx.save();ctx.shadowColor='#fff';ctx.shadowBlur=23;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,5.2,0,Math.PI*2);ctx.fill();ctx.restore()}
requestAnimationFrame(draw)}
async function run(){start.disabled=true;status.textContent='Starting camera…';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;await video.play();badge.textContent='Inner Light · Camera On';status.textContent='Camera ready. Loading automatic face tracking…';active=true;requestAnimationFrame(draw);const {FaceLandmarker,FilesetResolver}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm');const fileset=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');landmarker=await FaceLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'CPU'},runningMode:'VIDEO',numFaces:1});status.textContent='Ready! Your radiant virtues follow your forehead.';start.textContent='Camera Running'}catch(err){status.textContent=stream?'Camera works, but face tracking did not load. Check internet and reload.':'Camera unavailable. Allow camera access in Safari and try again.';console.error(err);start.disabled=false;start.textContent='Try Again'}}
start.addEventListener('click',run);window.addEventListener('pagehide',()=>stream?.getTracks().forEach(track=>track.stop()));
</script></body></html>
